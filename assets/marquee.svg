<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="46" viewBox="0 0 1100 46" role="img" ><title>Stack marquee</title><desc>Scrolling list of technologies found in the public repositories.</desc>
<defs>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="white" stop-opacity="0"/>
    <stop offset="0.05" stop-color="white" stop-opacity="1"/>
    <stop offset="0.95" stop-color="white" stop-opacity="1"/>
    <stop offset="1" stop-color="white" stop-opacity="0"/>
  </linearGradient>
  <mask id="edgeMask"><rect width="1100" height="46" fill="url(#edge)"/></mask>
</defs>
<rect width="1100" height="46" rx="10" fill="#0C1222" stroke="#243044"/>
<g mask="url(#edgeMask)">
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1740.0 0" dur="31.6s" repeatCount="indefinite"/>
    <text y="29" fill="#4ADE80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="0.6" textLength="1740" lengthAdjust="spacing">TYPESCRIPT    ·    REACT    ·    VITE    ·    NEXT.JS    ·    TAILWIND    ·    TANSTACK    ·    NODE    ·    NESTJS    ·    PYTHON    ·    C    ·    DOCKER    ·    GIT    ·    29 PUBLIC REPOS    ·    </text>
    <text x="1740" y="29" fill="#4ADE80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="0.6" textLength="1740" lengthAdjust="spacing">TYPESCRIPT    ·    REACT    ·    VITE    ·    NEXT.JS    ·    TAILWIND    ·    TANSTACK    ·    NODE    ·    NESTJS    ·    PYTHON    ·    C    ·    DOCKER    ·    GIT    ·    29 PUBLIC REPOS    ·    </text>
  </g>
</g>
</svg>
